name: Regression tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tx-types:
    name: Hosted and no-std regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install repository Rust toolchain
        run: rustup toolchain install nightly-2025-02-14 --profile minimal

      - name: Compile the production no-std library
        run: cargo check --locked -p tx-types --no-default-features --lib

      - name: Run no-std regression tests
        run: cargo test --locked -p tx-types --no-default-features

      - name: Run hosted regression tests
        run: cargo test --locked -p tx-types
