[package]
name = "tx-types"
version = "0.1.0"
edition = "2021"
authors = ["SWPSCO"]
description = "Transaction types and utilities for Nockchain"
repository = "https://github.com/SWPSCO/tx-types"
license = "MIT OR Apache-2.0"

[dependencies]
noun-serde = { path = "./nockchain-core/crates/noun-serde" }
nockapp = { path = "./nockchain-core/crates/nockapp", default-features = false, features = [] }
nockvm = { path = "./nockchain-core/crates/nockvm/rust/nockvm" }
nockchain-libp2p-io = { path = "./nockchain-core/crates/nockchain-libp2p-io", default-features = false }
zkvm-jetpack = { path = "./nockchain-core/crates/zkvm-jetpack" }
ibig = { path = "./nockchain-core/crates/nockvm/rust/ibig" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
either = "1.13"
num-bigint = "0.4"
bs58 = "0.5"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]

[features]
tracy = ["nockapp/tracing-tracy"]

[patch.crates-io]
tracy-client-sys = { path = "./dummy-tracy/tracy-client-sys" }
tracy-client = { path = "./dummy-tracy/tracy-client" }
tracing-tracy = { path = "./dummy-tracy/tracing-tracy" }