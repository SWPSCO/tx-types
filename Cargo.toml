[workspace]
members = ["tx-types", "pokenoun"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
# Nockchain dependencies - by default from git
# temporarily using nockpool/hoon-v1
noun-serde = { git = "https://github.com/swpsco/nockchain.git", rev = "980a0a1045e6adca027e9b5d3a909e56ffc12bc4" }
noun-serde-derive = { git = "https://github.com/swpsco/nockchain.git", rev = "980a0a1045e6adca027e9b5d3a909e56ffc12bc4" }
nockapp = { git = "https://github.com/swpsco/nockchain.git", rev = "980a0a1045e6adca027e9b5d3a909e56ffc12bc4", default-features = false }
nockvm = { git = "https://github.com/swpsco/nockchain.git", rev = "980a0a1045e6adca027e9b5d3a909e56ffc12bc4" }
nockchain-libp2p-io = { git = "https://github.com/swpsco/nockchain.git", rev = "980a0a1045e6adca027e9b5d3a909e56ffc12bc4", default-features = false }
nockchain-math = { git = "https://github.com/swpsco/nockchain.git", rev = "980a0a1045e6adca027e9b5d3a909e56ffc12bc4" }
zkvm-jetpack = { git = "https://github.com/swpsco/nockchain.git", rev = "980a0a1045e6adca027e9b5d3a909e56ffc12bc4" }
ibig = { git = "https://github.com/swpsco/nockchain.git", rev = "980a0a1045e6adca027e9b5d3a909e56ffc12bc4" }
murmur3 = { git = "https://github.com/swpsco/nockchain.git", rev = "980a0a1045e6adca027e9b5d3a909e56ffc12bc4" }
nockvm_macros = { git = "https://github.com/swpsco/nockchain.git", rev = "980a0a1045e6adca027e9b5d3a909e56ffc12bc4" }

# Standard dependencies (matching nockchain-minimal workspace)
aes = { version = "0.8.3", default-features = false }
aes-siv = { version = "0.7.0", default-features = false, features = ["alloc"] }
anyhow = "1.0"
arrayref = "0.3.7"
bincode = "2.0.0-rc.3"
bitvec = "1.0.1"
blake3 = { version = "1.5.1", features = ["serde"] }
bs58 = { version = "0.5.1", features = ["check"] }
byteorder = "1.5.0"
bytes = "1.5.0"
cfg-if = "1.0.0"
chrono = "0.4.40"
criterion = { git = "https://github.com/vlovich/criterion.rs.git", rev = "9b485aece85a3546126b06cc25d33e14aba829b3", features = ["html_reports"] }
curve25519-dalek = { version = "4.1.1", default-features = false }
ed25519-dalek = { version = "2.1.0", default-features = false }
either = "1.9.0"
getrandom = { version = "0.3.3", features = ["std"] }
hex-literal = "1.0.0"
intmap = "3.1.0"
json = "0.12.4"
lazy_static = "1.4.0"
libc = "0.2.171"
memmap2 = "^0.9.5"
num-bigint = "0.4"
num-derive = "0.4.2"
num-traits = "0.2.19"
once_cell = "1.21.3"
parking_lot = "0.12.4"
proc-macro2 = "1.0.91"
quote = "1.0.37"
quickcheck = "1.0.3"
rand = { version = "0.9.2", features = ["std"] }
rayon = "1.8.0"
rkyv = "0.8.10"
serde = "1.0.217"
serde_bytes = { version = "0.11.15", features = ["alloc"] }
serde_json = "1.0.104"
sha1 = { version = "0.10.6", default-features = false }
sha2 = { version = "0.10.8", default-features = false }
sha3 = "0.10.8"
slotmap = "1.0.7"
smallvec = "1.15.1"
static_assertions = "1.1.0"
strum = { version = "0.27.2", features = ["derive"] }
syn = { version = "2.0.39", features = ["full"] }
thiserror = "2.0.11"
tracing = "0.1.41"
tracing-core = "0.1"
tracing-tracy = { version = "0.11.4" }
tracy-client = { version = "0.18.2" }
x25519-dalek = { version = "2.0.0", features = ["static_secrets"], default-features = false }
bip39 = { version = "2.0", default-features = false, features = ["std"] }
hmac = "0.12"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
zeroize = { version = "1.0", default-features = false, features = ["alloc"] }
pokenoun = { path = "./pokenoun" }

[patch.crates-io]
tracy-client-sys = { path = "./dummy-tracy/tracy-client-sys" }
tracy-client = { path = "./dummy-tracy/tracy-client" }
tracing-tracy = { path = "./dummy-tracy/tracing-tracy" }

# Use local nockchain dependencies for WASM compilation
[patch."https://github.com/swpsco/nockchain.git"]
noun-serde = { path = "./nockchain-minimal/crates/noun-serde" }
noun-serde-derive = { path = "./nockchain-minimal/crates/noun-serde-derive" }
nockapp = { path = "./nockchain-minimal/crates/nockapp" }
nockvm = { path = "./nockchain-minimal/crates/nockvm/rust/nockvm" }
nockchain-libp2p-io = { path = "./nockchain-minimal/crates/nockchain-libp2p-io" }
nockchain-math = { path = "./nockchain-minimal/crates/nockchain-math" }
zkvm-jetpack = { path = "./nockchain-minimal/crates/zkvm-jetpack" }
ibig = { path = "./nockchain-minimal/crates/nockvm/rust/ibig" }
murmur3 = { path = "./nockchain-minimal/crates/nockvm/rust/murmur3" }
nockvm_macros = { path = "./nockchain-minimal/crates/nockvm/rust/nockvm_macros" }
