[package]
name = "tx-types"
version = "0.1.0"
edition = "2021"
authors = ["SWPSCO"]
description = "Transaction types and utilities for Nockchain"
repository = "https://github.com/SWPSCO/tx-types"
license = "MIT OR Apache-2.0"

[dependencies]
noun-serde = { git = "https://github.com/SWPSCO/nockchain.git", rev = "c88496985c83218ba3100e07031d56371bb02028" }
nockapp = { git = "https://github.com/SWPSCO/nockchain.git", rev = "c88496985c83218ba3100e07031d56371bb02028", default-features = false }
nockvm = { git = "https://github.com/SWPSCO/nockchain.git", rev = "c88496985c83218ba3100e07031d56371bb02028" }
nockchain-libp2p-io = { git = "https://github.com/SWPSCO/nockchain.git", rev = "c88496985c83218ba3100e07031d56371bb02028", default-features = false }
zkvm-jetpack = { git = "https://github.com/SWPSCO/nockchain.git", rev = "c88496985c83218ba3100e07031d56371bb02028" }
ibig = { git = "https://github.com/SWPSCO/nockchain.git", rev = "c88496985c83218ba3100e07031d56371bb02028" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
either = "1.13"
num-bigint = "0.4"
bs58 = "0.5"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]