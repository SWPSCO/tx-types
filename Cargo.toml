[workspace]
members = [
    "crates/tx-types",
    "crates/nicker",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
# Nockchain dependencies
noun-serde = { git = "https://github.com/SWPSCO/nockchain.git", rev = "fdf0d1b4445cfff8f285d18e3a2dbb219f337fc7" }
noun-serde-derive = { git = "https://github.com/SWPSCO/nockchain.git", rev = "fdf0d1b4445cfff8f285d18e3a2dbb219f337fc7" }
nockapp = { git = "https://github.com/SWPSCO/nockchain.git", rev = "fdf0d1b4445cfff8f285d18e3a2dbb219f337fc7", default-features = false }
nockvm = { git = "https://github.com/SWPSCO/nockchain.git", rev = "fdf0d1b4445cfff8f285d18e3a2dbb219f337fc7" }
nockvm_macros = { git = "https://github.com/SWPSCO/nockchain.git", rev = "fdf0d1b4445cfff8f285d18e3a2dbb219f337fc7" }
nockchain-libp2p-io = { git = "https://github.com/SWPSCO/nockchain.git", rev = "fdf0d1b4445cfff8f285d18e3a2dbb219f337fc7", default-features = false }
zkvm-jetpack = { git = "https://github.com/SWPSCO/nockchain.git", rev = "fdf0d1b4445cfff8f285d18e3a2dbb219f337fc7" }
ibig = { git = "https://github.com/SWPSCO/nockchain.git", rev = "fdf0d1b4445cfff8f285d18e3a2dbb219f337fc7" }
proc-macro2 = "1.0"

# Standard dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tokio = { version = "1.44.2", features = ["full"] }
tracing = { version = "0.1.41" }
tracing-subscriber = { version = "0.3.19" }
clap = { version = "4.5.37", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6.1", features = ["v4"] }
bytes = { version = "1.10.1" }
futures = "0.3"
hex = { version = "0.4.3" }
rand = { version = "0.8.5" }

# Math/crypto dependencies
num-bigint = "0.4"
num-traits = "0.2.19"
bs58 = "0.5"
bip39 = "2.0"
hmac = "0.12"
sha2 = "0.10"
pbkdf2 = "0.12"
zeroize = "1.0"

[patch.crates-io]
tracy-client-sys = { path = "crates/nockchain-rpc-server/dummy-tracy/tracy-client-sys" }
tracy-client = { path = "crates/nockchain-rpc-server/dummy-tracy/tracy-client" }
tracing-tracy = { path = "crates/nockchain-rpc-server/dummy-tracy/tracing-tracy" }